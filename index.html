<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Privacy Policies</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1b1f; --bg: #ffffff; --muted: #5d5e66; --accent: #2a5bd7; --rule: #e2e2ea; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e6ee; --bg: #121216; --muted: #a3a4ad; --accent: #8fb0ff; --rule: #2c2c34; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: var(--accent); } li { margin: .5rem 0; } p { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Privacy policies</h1>
<ul>
  <li><a href="cleanswipe/">CleanSwipe privacy policy</a></li>
  <li><a href="quickkit/">QuickKit privacy policy</a></li>
</ul>
</main>
</body>
</html>
